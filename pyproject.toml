[project]
name = "axiom"
version = "0.1.0"
description = "Research experiment planning, execution and evidence tracking prototype."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# Runtime dependencies – the canonical backend implementation
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.2.3",
    "openai>=1.45.0",
    "httpx>=0.27.0",
]

# Optional development and experiment dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]
ml-benchmark = [
    "scikit-learn>=1.5,<2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "experiments", "tests"]

[tool.setuptools.package-data]
backend = ["axiom/benchmarks/datasets/*.json"]
