name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # Keep tests hermetic: never consume personal .env settings or live API credentials.
      AXIOM_REASONING_PROVIDER: echo
      AXIOM_EXECUTOR_BACKEND: local
      AXIOM_DB_PATH: ":memory:"
      AXIOM_ARTIFACT_ROOT: artifacts
      NEBIUS_API_KEY: ""
      NEBIUS_S3_ACCESS_KEY_ID: ""
      NEBIUS_S3_SECRET_ACCESS_KEY: ""
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q
